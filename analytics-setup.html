<!-- Google Analytics 4 Configuration -->
<!-- IMPORTANTE: Reemplaza GA_MEASUREMENT_ID con tu ID de Google Analytics 4 -->

<script async src="https://www.googletagmanager.com/gtag/js?id=GA_MEASUREMENT_ID"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());

    gtag('config', 'GA_MEASUREMENT_ID', {
        'page_path': window.location.pathname,
        'page_title': document.title,
        'allow_google_signals': true,
        'allow_ad_personalization_signals': true
    });

    // Rastrear eventos personalizados

    // Evento: Clic en WhatsApp
    document.addEventListener('click', function (e) {
        if (e.target.href && e.target.href.includes('wa.me')) {
            gtag('event', 'whatsapp_click', {
                'event_category': 'engagement',
                'event_label': 'whatsapp_contact'
            });
        }
    });

    // Evento: Envío de formulario
    const contactForm = document.querySelector('form[name="contactForm"]');
    if (contactForm) {
        contactForm.addEventListener('submit', function () {
            gtag('event', 'form_submission', {
                'event_category': 'engagement',
                'event_label': 'contact_form'
            });
        });
    }

    // Evento: Modal de servicios abierto
    const openServicesModal = document.getElementById('openServicesModal');
    if (openServicesModal) {
        openServicesModal.addEventListener('click', function () {
            gtag('event', 'services_modal_open', {
                'event_category': 'engagement',
                'event_label': 'quick_services'
            });
        });
    }

</script>

<!-- Meta Pixel para Facebook -->

<script>
    !function (f, b, e, v, n, t, s) {
        if (f.fbq) return; n = f.fbq = function () {
            n.callMethod ?
            n.callMethod.apply(n, arguments) : n.queue.push(arguments)
        };
        if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = '2.0';
        n.queue = []; t = b.createElement(e); t.async = !0;
        t.src = v; s = b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t, s)
    }(window, document, 'script',
        'https://connect.facebook.net/en_US/fbevents.js');

    fbq('init', 'PIXEL_ID');
    fbq('track', 'PageView');
</script>
