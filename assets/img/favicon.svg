<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#778cab;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2a2f36;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="64" height="64" fill="url(#bgGradient)" rx="12"/>
  
  <!-- Balance of Justice Scale -->
  <g transform="translate(32, 28)">
    <!-- Central pole/handle -->
    <rect x="-1.5" y="-16" width="3" height="16" fill="#FFD700" rx="1"/>
    
    <!-- Center point circle -->
    <circle cx="0" cy="0" r="2.5" fill="#FFD700"/>
    
    <!-- Left beam -->
    <line x1="-12" y1="0" x2="0" y2="0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right beam -->
    <line x1="0" y1="0" x2="12" y2="0" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Left pan (scale) -->
    <rect x="-14" y="1" width="6" height="4" fill="#FFD700" rx="1"/>
    <path d="M -14 1 L -14.5 5 L -13.5 5 Z" fill="#FFD700"/>
    <path d="M -8 1 L -7.5 5 L -8.5 5 Z" fill="#FFD700"/>
    
    <!-- Right pan (scale) -->
    <rect x="8" y="1" width="6" height="4" fill="#FFD700" rx="1"/>
    <path d="M 8 1 L 7.5 5 L 8.5 5 Z" fill="#FFD700"/>
    <path d="M 14 1 L 14.5 5 L 13.5 5 Z" fill="#FFD700"/>
    
    <!-- Left weight (sphere) -->
    <circle cx="-11" cy="8" r="3.5" fill="#FF6B6B" opacity="0.9"/>
    <circle cx="-11" cy="7" r="1" fill="#ffffff" opacity="0.4"/>
    
    <!-- Right weight (sphere) -->
    <circle cx="11" cy="8" r="3.5" fill="#FF6B6B" opacity="0.9"/>
    <circle cx="11" cy="7" r="1" fill="#ffffff" opacity="0.4"/>
  </g>
</svg>